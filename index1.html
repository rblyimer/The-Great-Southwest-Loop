<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F4">
<title>Route '26 · West Coast & Canyon Country</title>
<style>
  :root{
    --paper:#FBF9F4; --paper2:#F2EEE3; --card:#FFFFFF;
    --ink:#20242E; --ink2:#565E6E; --line:#E2DCCD; --line2:#DAD3C4;
    --route:#2E6E73; --route-d:#23565A; --route-t:#E3EEEC;
    --signal:#C8541B; --signal-t:#FBEADF;
    --good:#4E7D3F; --good-t:#E9F0E4;
    --gold:#B98A1F;
    --r:14px; --rs:9px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,"Helvetica Neue",Arial,sans-serif;
    --navbg:rgba(251,249,244,.92);
    --shadow:0 1px 2px rgba(32,36,46,.05),0 6px 18px rgba(32,36,46,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:580px;margin:0 auto;min-height:100vh}
  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 18px 11px;
  }
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand .mark{font-weight:800;letter-spacing:-.02em;font-size:18px}
  .brand .mark .yr{color:var(--route)}
  .brand .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
  .progress{margin-top:9px;display:flex;align-items:center;gap:10px}
  .meter{flex:1;height:5px;background:var(--paper2);border-radius:99px;overflow:hidden}
  .meter span{display:block;height:100%;background:linear-gradient(90deg,var(--route),var(--gold));border-radius:99px;transition:width .5s}
  .meter-lab{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.04em;white-space:nowrap}
  /* ---------- views ---------- */
  main{padding:16px 16px 28px}
  .view{display:none;animation:fade .28s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  h2.vh{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:2px 0 14px}
  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:15px 16px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--route);font-weight:700}
  /* daytag */
  .daytag{display:inline-flex;align-items:center;gap:7px;background:var(--route);color:#fff;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.1em}
  .daytag .n{font-variant-numeric:tabular-nums}
  .daytag .d{opacity:.78;font-weight:600}
  /* ---------- TODAY ---------- */
  .now-title{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:11px 0 2px}
  .now-region{font-size:12.5px;color:var(--ink2);font-weight:600}
  .countdown{text-align:center;padding:26px 16px}
  .countdown .big{font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--route);font-variant-numeric:tabular-nums}
  .countdown .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-top:8px}
  .countdown .sd{margin-top:4px;font-size:14px;color:var(--ink2)}
  .stack{display:flex;flex-direction:column;gap:12px}
  /* ---------- flag callouts ---------- */
  .flag{border-radius:var(--rs);padding:12px 13px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
  .flag .fi{flex:none;font-size:15px;line-height:1.3}
  .flag b{display:block;font-size:13.5px;margin-bottom:2px}
  .flag p{margin:0;font-size:13px;line-height:1.45}
  .flag.warn{background:var(--signal-t);border-color:#EAC3A8;color:#7a3812}
  .flag.warn b{color:var(--signal)}
  .flag.info{background:var(--route-t);border-color:#BcD8D5;color:#1d4d50}
  .flag.info b{color:var(--route-d)}
  .flag.good{background:var(--good-t);border-color:#C7D8BC;color:#3a5e2f}
  .flag.good b{color:var(--good)}
  /* ---------- day list ---------- */
  .dlist{display:flex;flex-direction:column;gap:10px}
  .drow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;color:inherit}
  .drow:active{transform:scale(.99)}
  .drow.today{border-color:var(--route);box-shadow:0 0 0 1px var(--route),var(--shadow)}
  .drow .dn{flex:none;width:42px;text-align:center}
  .drow .dn b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--route);line-height:1}
  .drow .dn span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .drow .dm{flex:1;min-width:0}
  .drow .dm b{display:block;font-size:14.5px;line-height:1.3}
  .drow .dm span{font-size:12px;color:var(--ink2)}
  .drow .chev{flex:none;color:var(--line2);font-size:18px}
  .drow .badge{flex:none;width:8px;height:8px;border-radius:99px;background:var(--signal)}
  /* ---------- day detail / timeline rail ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--route);font-weight:700;font-size:14px;padding:4px 0;margin-bottom:8px;cursor:pointer;font-family:inherit}
  .rail{margin:4px 0 2px;position:relative}
  .ri{display:flex;gap:12px;position:relative;padding-bottom:14px}
  .ri:last-child{padding-bottom:2px}
  .ri .time{flex:none;width:78px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--ink);padding-top:1px;line-height:1.35}
  .ri .node{flex:none;width:18px;display:flex;justify-content:center;position:relative}
  .ri .node::before{content:"";position:absolute;top:14px;bottom:-2px;width:2px;background:var(--line2)}
  .ri:last-child .node::before{display:none}
  .ri .dot{width:11px;height:11px;border-radius:99px;border:2px solid var(--route);background:var(--paper);margin-top:5px;z-index:1}
  .ri.fixed .dot{background:var(--route);box-shadow:0 0 0 4px var(--route-t)}
  .ri.opt .dot{border-color:var(--gold);border-style:dotted}
  .ri.flag .dot{width:13px;height:13px;border-radius:3px;transform:rotate(45deg);border-color:var(--signal);background:var(--signal)}
  .ri .plan{flex:1;min-width:0;padding-top:1px;font-size:14px;line-height:1.4}
  .ri .plan .rdet{display:block;font-size:12px;font-weight:400;color:var(--ink2);margin-top:2px;line-height:1.42}
  .ri.fixed .plan{font-weight:700}
  .ri .plan .tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .tag.bk{background:var(--route-t);color:var(--route-d)}
  .tag.op{background:#F6EFD9;color:var(--gold)}
  .sec-lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:18px 0 9px}
  .cuts{display:flex;flex-direction:column;gap:7px}
  .alts{display:flex;flex-direction:column;gap:8px}
  .altrow{display:flex;gap:9px;font-size:13.5px;align-items:flex-start;line-height:1.4}
  .altrow .plus{flex:none;color:var(--route);font-weight:800}
  .altrow .m{color:var(--ink2)}
  .altrow .atxt{flex:1;min-width:0}
  .altlink{flex:none;color:var(--route);font-weight:800;text-decoration:none;font-size:15px;padding:0 2px;line-height:1.3}
  .tg{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;vertical-align:middle;white-space:nowrap}
  .tg-now{background:var(--signal-t);color:#A34412}
  .tg-soon{background:#F4E7C6;color:#7A5A12}
  .tg-walk{background:var(--good-t);color:#3F6B34}
  .tg-booked{background:var(--route-t);color:var(--route-d)}
  body.dark .tg-now{color:#F3A06A}
  body.dark .tg-soon{background:#3A3320;color:var(--gold)}
  body.dark .tg-walk{color:#9CD083}
  .mlink{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:var(--route);text-decoration:none}
  .mlink:active{opacity:.6}
  .tot-split{display:flex;gap:10px;margin:9px 0 3px}
  .tot-split>div{flex:1;background:var(--paper2);border-radius:11px;padding:9px 12px}
  .tot-split b{display:block;font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .tot-split span{font-size:11px;color:var(--ink2);letter-spacing:.03em}
  .tnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .tnav-b{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--route);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);font-family:inherit}
  .tnav-b:active{transform:scale(.94)}
  .tnav-b:disabled{opacity:.35;pointer-events:none;color:var(--ink2)}
  .tnav-lab{flex:1;text-align:center;line-height:1.25;min-width:0}
  .tnav-lab b{display:block;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .tnav-lab span{font-size:12px;color:var(--ink2)}
  .tnav-reset{color:var(--route);font-weight:700;text-decoration:none}
  .cut{display:flex;gap:9px;font-size:13.5px;align-items:flex-start}
  .cut .k{flex:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--signal);background:var(--signal-t);border-radius:5px;padding:2px 6px;margin-top:1px;white-space:nowrap}
  /* ---------- stays ---------- */
  .stay-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .stay-hd b{font-size:15.5px;line-height:1.25}
  .stay-dates{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--route-d);background:var(--route-t);padding:3px 8px;border-radius:6px;white-space:nowrap}
  .stay-cost{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:10px;font-size:13px}
  .kv dt{color:var(--ink2);font-weight:600}
  .kv dd{margin:0;text-align:right}
  .stay-act{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:700;font-size:13px;padding:9px;border-radius:9px;border:1px solid var(--line2);color:var(--ink);background:var(--paper)}
  .btn:active{transform:scale(.98)}
  .btn.pri{background:var(--route);color:#fff;border-color:var(--route)}
  .cxl{font-size:11.5px;color:var(--signal);font-weight:700;margin-top:9px}
  .cxl.none{color:var(--ink2)}
  /* ---------- budget ---------- */
  .bt{width:100%;border-collapse:collapse;font-size:13.5px}
  .bt td{padding:9px 0;border-top:1px solid var(--line)}
  .bt tr:first-child td{border-top:0}
  .bt td.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .bt tr.tot td{border-top:2px solid var(--ink);font-weight:800;font-size:14.5px}
  .big-tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
  .big-tot .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .big-tot .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--route)}
  /* ---------- checklists ---------- */
  .ck{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
  .ck:first-child{border-top:0}
  .box{flex:none;width:21px;height:21px;border-radius:6px;border:2px solid var(--line2);margin-top:1px;display:grid;place-items:center;transition:.15s}
  .box svg{width:12px;height:12px;opacity:0;stroke:#fff;stroke-width:3.2;fill:none}
  .ck.done .box{background:var(--route);border-color:var(--route)}
  .ck.done .box svg{opacity:1}
  .ck .ct{flex:1;min-width:0;font-size:14px;line-height:1.4;transition:.15s}
  .ck .ct .meta{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
  .ck.done .ct{color:var(--ink2)}
  .ck.done .ct b{text-decoration:line-through;text-decoration-color:var(--line2)}
  .acc{margin-bottom:10px}
  .acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;cursor:pointer;font-family:inherit;color:inherit;text-align:left}
  .acc-h:active{transform:scale(.992)}
  .acc.open .acc-h{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
  .acc-t{font-size:13px;letter-spacing:.03em;font-weight:700;color:var(--ink)}
  .acc-r{display:flex;align-items:center;gap:11px;flex:none}
  .acc-c{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
  .acc-c.full{color:var(--good)}
  .acc-h .chev{font-size:18px;color:var(--line2);transition:transform .2s}
  .acc.open .acc-h .chev{transform:rotate(90deg);color:var(--route)}
  .acc-b{display:none}
  .acc.open .acc-b{display:block}
  .acc.open .acc-b .card{border-radius:0 0 var(--r) var(--r);border-top:0}
  .phase{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 9px;padding-bottom:6px;border-bottom:1.5px solid var(--line2)}
  .phase:first-child{margin-top:2px}
  .phase .pt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--route-d)}
  .phase .ps{font-size:11px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ri .plan .rdet{padding-left:9px;border-left:2px solid var(--line)}
  .nav-b.on{background:var(--route-t)}
  .drow{transition:transform .08s ease, box-shadow .15s ease}
  .calls a{color:var(--route);font-weight:700;text-decoration:none}
  /* ---------- reference ---------- */
  .ref-h{font-size:14.5px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .tz{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13.5px}
  .tz .z{color:var(--ink2)}
  .tz .o{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .covers li{margin:3px 0;font-size:13.5px}
  .num{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
  .num:first-of-type{border-top:0}
  .num b{font-weight:600}
  .num a{color:var(--route);font-weight:800;text-decoration:none;font-variant-numeric:tabular-nums}
  /* ---------- bottom nav ---------- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--navbg);backdrop-filter:saturate(1.4) blur(10px);
    border-top:1px solid var(--line);
    display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    max-width:580px;margin:0 auto;
  }
  .nav-b{flex:1;background:none;border:0;font-family:inherit;cursor:pointer;color:var(--ink2);
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:10px}
  .nav-b .ni{font-size:19px;line-height:1}
  .nav-b .nl{font-size:10px;font-weight:700;letter-spacing:.02em}
  .nav-b.on{color:var(--route)}
  .nav-b.on .ni{transform:translateY(-1px)}
  .note{font-size:12px;color:var(--ink2);line-height:1.5}
  .hr{height:1px;background:var(--line);margin:16px 0}
  .mtop{margin-top:12px}
  /* prev/next day nav */
  .daynav{display:flex;gap:10px;margin-top:20px}
  .daynav button{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 13px;cursor:pointer;font-family:inherit;color:inherit;text-align:left}
  .daynav button:active{transform:scale(.99)}
  .daynav button.nx{text-align:right;align-items:flex-end}
  .daynav .dl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--route);font-weight:700}
  .daynav .dt{font-size:12.5px;font-weight:700;line-height:1.25;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  /* budget target bar */
  .bbar-w{margin-top:15px}
  .bbar{height:12px;border-radius:99px;background:var(--paper2);overflow:hidden;display:flex}
  .bbar i{display:block;height:100%}
  .bbar i.b1{background:var(--route)}
  .bbar-leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12px;color:var(--ink2)}
  .bbar-leg span.it{display:inline-flex;align-items:center;gap:6px}
  .bbar-leg .sw{width:10px;height:10px;border-radius:3px;flex:none}
  /* prep overall progress */
  .pbar-w{margin:0 0 18px}
  .pbar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .pbar-top .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .pbar-top .v{font-size:13px;font-weight:800;color:var(--route);font-variant-numeric:tabular-nums}
  .pbar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden}
  .pbar span{display:block;height:100%;background:linear-gradient(90deg,var(--route),var(--gold));border-radius:99px;transition:width .35s ease}
  /* nav icons */
  .nav-b .ni svg{width:23px;height:23px;display:block;stroke:currentColor;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .15s}
  .nav-b.on .ni svg{stroke-width:2.3}
  /* accordion open animation */
  .acc.open .acc-b{animation:accIn .22s ease}
  @keyframes accIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  /* header theme toggle */
  .brand-r{display:flex;align-items:center;gap:12px}
  .theme-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit;box-shadow:var(--shadow);transition:color .2s,background .2s,border-color .2s}
  .theme-btn:active{transform:scale(.94)}
  /* active tab indicator */
  .nav-b{position:relative}
  .nav-b.on::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:99px;background:var(--route)}
  /* day-change transition */
  #v-days.dani{animation:dayIn .24s ease}
  @keyframes dayIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
  /* smooth theme cross-fade */
  body,.card,header,nav,.drow,.acc-h,.box,.theme-btn{transition:background-color .25s ease,border-color .25s ease,color .25s ease}
  /* ---------- dark mode ---------- */
  body.dark{
    --paper:#15181E;--paper2:#1F242D;--card:#1D222A;
    --ink:#ECE8DC;--ink2:#9BA4B3;--line:#2B323C;--line2:#3A424E;
    --route:#57AEAE;--route-d:#86C9C9;--route-t:#173130;
    --signal:#E8763B;--signal-t:#3A2417;
    --good:#7DB668;--good-t:#202C19;
    --gold:#D8AA3E;
    --navbg:rgba(21,24,30,.92);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.4);
  }
  body.dark .flag.warn{border-color:#5A3A22;color:#F0C6A6}
  body.dark .flag.warn b{color:#F08A4E}
  body.dark .flag.info{border-color:#244B4E;color:#AAD9D7}
  body.dark .flag.info b{color:#86C9C9}
  body.dark .flag.good{border-color:#2D4522;color:#BCDAAD}
  body.dark .flag.good b{color:#9CD083}
  body.dark .tag.op{background:#3A3320;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">Route <span class="yr">'26</span></div>
      <div class="brand-r">
        <div class="sub">Jul 8 – 25</div>
        <button class="theme-btn" id="themeToggle" aria-label="Toggle dark mode"><span id="themeIcon">☾</span></button>

/* ---- which trip-day is today (device date) ---- */
function todayIndex(){
  var now=new Date();
  var y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  if(y<2026 || (y===2026&&m<6)) return {state:"pre",left:Math.ceil((new Date(2026,6,8)-now)/86400000)};
  if(y===2026 && m===6 && d>=8 && d<=25) return {state:"on",n:d-7};
  if(y>2026 || (y===2026&&(m>6||(m===6&&d>25)))) return {state:"post"};
  return {state:"pre",left:Math.ceil((new Date(2026,6,8)-now)/86400000)};
}

function checklistAccordion(title,key,items,open){

    var meta=(it.m||tel||lnk)?("<span class='meta'>"+(it.m||"")+tel+lnk+"</span>"):"";
    row.appendChild(el("div","ct"+(it.tel||it.q?" calls":""),"<b>"+(it.b||it)+"</b>"+chip+meta));

  var done=0,tot=0;
  PREP_KEYS.forEach(function(k){tot+=k[1];var s=STORE.get(k[0])||{};for(var i=0;i<k[1];i++){if(s[i])done++;}});
  var f=$("#prepFill");if(f)f.style.width=(tot?(done/tot*100):0)+"%";
  var c=$("#prepCount");if(c)c.textContent=done+" / "+tot;
}
function renderPrep(){
  var v=$("#v-prep"); v.innerHTML="";
  v.appendChild(el("h2","vh","Prep + reference"));
  var pbw=el("div","pbar-w");
  pbw.innerHTML="<div class='pbar-top'><span class='l'>Overall checklist</span><span class='v' id='prepCount'>0 / 0</span></div><div class='pbar'><span id='prepFill' style='width:0%'></span></div>";
  v.appendChild(pbw);
  var groups=[
    ["Book next — timed","ck_book",TRIP.book,true],
    ["Restaurant reservations","ck_dine",TRIP.dine,true],
    ["Calls to make","ck_calls",TRIP.calls,true],
    ["Confirm & decide before you go","ck_confirm",TRIP.confirm,true],
    ["Documents & confirmations","ck_docs",toCk(TRIP.docs),false],
    ["Clothing & layers","ck_clothing",toCk(TRIP.clothing),false],
    ["Apps to install","ck_apps",toCk(TRIP.apps),false],
    ["Downloads · offline before you go","ck_downloads",toCk(TRIP.downloads),false],
    ["Car kit — set up day one","ck_carkit",toCk(TRIP.carkit),false],
    ["Tech & electronics","ck_tech",toCk(TRIP.tech),false],
    ["Hiking & outdoor","ck_hiking",toCk(TRIP.hiking),false],
    ["Beach & water (kayak day)","ck_water",toCk(TRIP.water),false],
    ["Toiletries & health","ck_health",toCk(TRIP.health),false],
    ["Car food & snacks","ck_food",toCk(TRIP.food),false],
    ["Fuel reminders","ck_fuel",toCk(TRIP.fuel),false],
    ["Security on the road","ck_secure",toCk(TRIP.secure),false]
  ];
  groups.forEach(function(g){v.appendChild(checklistAccordion(g[0],g[1],g[2],g[3]))});
  PREP_KEYS=groups.map(function(g){return [g[1],g[2].length]});
  syncPrep();

  v.appendChild(el("div","hr"));

  // time zones
  var tzc=el("div","card pad");
  tzc.appendChild(el("div","ref-h","⏱ Time-zone cheat sheet"));
  var tz=el("div","tz");
  TRIP.tz.forEach(function(r){tz.appendChild(el("div","z",r[0]));tz.appendChild(el("div","o",r[1]))});
  tzc.appendChild(tz);
  tzc.appendChild(el("p","note mtop",TRIP.tzNote));
  v.appendChild(tzc);

  // pass doesn't cover
  var pc=el("div","card pad mtop");
  pc.appendChild(el("div","ref-h","🎟 Pass does NOT cover"));
  var ul=el("ul","covers");ul.style.margin="0";ul.style.paddingLeft="18px";
  TRIP.passDoesnt.forEach(function(x){ul.appendChild(el("li",null,x))});
  pc.appendChild(ul);
  v.appendChild(pc);

  // numbers
  var nc=el("div","card pad mtop");
  nc.appendChild(el("div","ref-h","☎ Key numbers"));
  TRIP.nums.forEach(function(r){
    var row=el("div","num");
    row.appendChild(el("b",null,r[0]));
    var a=el("a",null,r[1]);a.href=telHref(r[1]);
    row.appendChild(a);nc.appendChild(row);
  });
  v.appendChild(nc);

  v.appendChild(el("p","note mtop","Save this page to your phone (Share → Add to Home Screen, or save the file) so it works in the canyons with no signal. Your check marks are stored on this device."));
}

/* ====================== ROUTER ====================== */
var RENDERED={};
function go(name){
  STORE.set("tab",name);
  if(name==="today")TODAY_VIEW=null;
  ["today","days","stays","budget","prep"].forEach(function(n){
    $("#v-"+n).classList.toggle("on",n===name);
  });
  document.querySelectorAll(".nav-b").forEach(function(b){b.classList.toggle("on",b.dataset.go===name)});
  var fn={today:renderToday,days:renderDays,stays:renderStays,budget:renderBudget,prep:renderPrep}[name];
  fn(); window.scrollTo(0,0);
}
document.querySelectorAll(".nav-b").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});

/* progress meter */
(function(){
  var ti=todayIndex();var fill=$("#meterFill"),lab=$("#meterLab");
  if(ti.state==="on"){fill.style.width=(ti.n/18*100)+"%";lab.textContent="Day "+ti.n+" of 18";}
  else if(ti.state==="post"){fill.style.width="100%";lab.textContent="Trip complete";}
  else{fill.style.width="0%";lab.textContent=ti.left+" days out";}
})();

/* theme init + toggle */
(function(){applyTheme(STORE.get("theme")||"light");var b=$("#themeToggle");if(b)b.onclick=function(){var nt=(document.body&&document.body.classList.contains("dark"))?"light":"dark";STORE.set("theme",nt);applyTheme(nt);};})();
/* swipe left/right between days */
(function(){var vd=$("#v-days");if(!vd||!vd.addEventListener)return;var x0=null,y0=null;
  vd.addEventListener("touchstart",function(e){var t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  vd.addEventListener("touchend",function(e){if(OPEN_DAY===null||x0===null)return;var t=e.changedTouches[0];var dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&OPEN_DAY<TRIP.days.length-1)openDay(OPEN_DAY+1);else if(dx>0&&OPEN_DAY>0)openDay(OPEN_DAY-1);}x0=y0=null;},{passive:true});
})();
/* restore last-used tab */
(function(){var t=STORE.get("tab");if(["today","days","stays","budget","prep"].indexOf(t)<0)t="today";go(t);})();
</script>
